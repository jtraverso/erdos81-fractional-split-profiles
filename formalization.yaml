version: "v0.4"

project:
  name: "Affine profile reduction for fractional triangle packings in split graphs"
  description: >-
    A Lean 4 / Mathlib formalization of the main result of the author's preprint "Affine Profile
    Reduction for Fractional Triangle Packings in Split Graphs" (Erdős #81 series, Paper I): for
    every finite split graph G on n vertices, |E(G)| − 2ν₃*(G) ≤ n²/6 + n/2, where ν₃* is the
    fractional triangle packing number (the maximum total weight of a nonnegative weighting of
    the triangles with load at most one on every edge). It is stated both for the paper's finite
    split model (clique Fin p, independent vertices, neighbourhoods) and for every split graph in
    Mathlib's SimpleGraph, with the definitions of split graphs and fractional triangle packings
    of two registered entries; the weaker bound n²/6 + n of the first edition is also included.
    The proof reduces the fractional packing problem to neighbourhood profiles and a
    three-variable linear program, using finite LP duality. Version 2 states the finite LP duality
    used in the series as results of its own, over ℝ (Farkas' lemma in inequality form and
    covering/packing strong duality, from this proof) and over ℚ (Farkas' lemma by Fourier–Motzkin
    elimination and strong duality for the rational packing LP, from the author's Paper V).
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

