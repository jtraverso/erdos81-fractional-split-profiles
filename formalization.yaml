fidelity:
  divergences: >-
    ν₃* is a real supremum over feasible packings; in the finite model triangles and edges are
    explicit subtypes of index triples and pairs, and in the SimpleGraph form triangles are the
    3-cliques and weights live on vertex sets. The two forms are related by a proved bridge.
    The duality statements are written with explicit finite sums over finite index types; over ℚ
    the Farkas alternative is for systems M x ≤ b with free variables, and the packing LP has
    capacities 1 and requires every item to use some resource with coefficient at least 1.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the statements
    were compared with the preprint, the copied definitions with the registered entries, and the
    bridge was sanity-checked on small graphs (ErdosPaperI/SimpleGraphBridgeSanity.lean: three small split
    graphs, among them K₃ and K₁,₃). The mathematical development and the article are the author's; no
    independent human review of the formalization has been performed.

