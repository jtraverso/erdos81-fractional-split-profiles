status:
  scope: >-
    Proved for every finite split graph: in the finite model (any clique size p, any finite type
    of independent vertices, any neighbourhoods) and for every split SimpleGraph on a finite
    vertex type, through an explicit bridge between the two (ErdosPaperI/SimpleGraphBridge.lean).
    The duality results (namespace FiniteLPDuality) hold for all finite index types.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

